# Demo gratuita en Render: los datos se reinician cuando el servicio se duerme o se redeploya.
services:
  - type: web
    name: grovee-admin-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/grovee.db
